<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Arcade - Results</title>
    <link rel="stylesheet" href="quiz.css" />
    <link rel="stylesheet" href="end.css" />
  </head>
  <body>
    <main class="container">
      <section id="end" class="content-card end-card">
        <p class="eyebrow">Round complete</p>
        <h1 id="finalScore"></h1>
        <p class="end-copy">
          Save your score to the board if you made the cut.
        </p>
        <form id="saveScoreForm" class="save-form">
          <input
            type="text"
            name="username"
            id="username"
            placeholder="Enter your name"
            autocomplete="name"
            maxlength="12"
          />
          <button class="btn" type="submit" id="saveScoreBtn" disabled>
            Save Score
          </button>
        </form>
        <div class="button-row">
          <a class="btn" href="game.html">Play Again</a>
          <a class="btn btn-secondary" href="highscores.html">High Scores</a>
          <a class="btn btn-secondary" href="quiz.html">Go Home</a>
        </div>
      </section>
    </main>

    <script src="end.js"></script>
  </body>
</html>
